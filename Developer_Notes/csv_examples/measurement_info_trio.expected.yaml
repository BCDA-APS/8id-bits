# Hand-written from the CSV by a human reading the format spec -- NOT dumped
# from the converter.
#
# One #BATCH row -> one run block named <protocol>_sample<N>. The run's
# protocols: list is every protocol the referenced CSV defines, sorted --
# trio_protocol.csv has a single #BATCH row (att_level 1) so it defines one.
loop_order: sample_major
runs:
  - name: trio_protocol_sample1
    samples: [1]
    protocols: [trio_protocol_att1]
    repeats: 1
protocols:
  trio_protocol_att1:
    wait_time: 0
    sample_move: no
    position_reset: no
    att_level: 1
    num_repeats: 1
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        qmap_file: rigaku3m_qmap_default.hdf
        analysis_type: Multitau
        shutter_owner: yes
        hdf_timeout: 600
        acq_time: 1
        num_frames: 10
      - device: eiger4M
        mode: Internal Series
        qmap_file: eiger4m_qmap_default.hdf
        analysis_type: Multitau
        shutter_owner: no
        hdf_timeout: 600
        acq_time: 1
        num_frames: 10
      - device: lambda2M
        mode: Internal
        qmap_file: lambda2m_qmap_default.hdf
        analysis_type: Multitau
        shutter_owner: no
        hdf_timeout: 600
        acq_time: 1
        num_frames: 10
