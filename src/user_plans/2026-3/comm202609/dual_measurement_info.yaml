loop_order: sample_major

runs:
 - name: dual_att_series
   samples: [1]
   protocols: [dual_att2]
   repeats: 1

###### Change here to change measurement conditions #######

# The five protocols below are identical apart from att_level, and run in the order listed in
# the run block above: 20, 10, 5, 2, 1. There is no YAML anchor here on purpose, so a change
# to acq_time, num_frames or a qmap has to be made in all five.
#
# Eiger beam-centre metadata: with no geometry block the Eiger's metadata comes from the
# eiger4M entry in device_position.yaml -- db_x 716, db_y 815, distance 11.5 m -- which was
# calibrated with the Aerotech stage at detector.x 256, detector.y 77. In a dual run the
# Rigaku owns that stage and it sits at -250 / 170, so those numbers probably do not describe
# this measurement. Raw frames are unaffected; only the _metadata.hdf is. To correct it, add
# a geometry: block to the eiger4M leg -- fields are documented at the bottom of this file.

protocols:

  dual_att20:
    att_level: 20
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        acq_time: 1
        num_frames: 3000
        qmap_file: rigaku3m_qmap_Sq360_Dq18_Sphi16_Dphi1_lin.hdf
        analysis_type: Both
        select_device: yes
        shutter_owner: yes
        start_timeout: 30
        hdf_timeout: 600
      - device: eiger4M
        mode: Internal Series
        acq_time: 1
        num_frames: 3000
        qmap_file: eiger4m_qmap_Sq360_Sphi9_Dq3_Dphi1_WAXPCS_lin.hdf
        analysis_type: Both
        hdf_timeout: 600

