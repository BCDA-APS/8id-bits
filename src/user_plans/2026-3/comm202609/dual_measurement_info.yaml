_instructions: |
  Runs the Eiger and the Rigaku in the same beam window instead of back to back. The pair is
  NOT frame-synced -- the acquisitions overlap, so a pair of long measurements costs roughly
  the slower one rather than the sum of both.

  To run:

    dry_run_dual_measurement_info(check_hardware=True)    # validate + preview, moves nothing
    run_dual_measurement_info()                           # go

  Both are imported by startup.py, so they are available in the session already.

  ---------------------------------------------------------------------------
  What this file currently does
  ---------------------------------------------------------------------------

  Sample 1, five measurements, in this order:

    att_level 20 -> 10 -> 5 -> 2 -> 1        (most attenuated first)

  Each runs BOTH detectors in parallel at 1 s per frame, 3000 frames:

    3000 s = 50 min of beam per attenuation step
    5 steps = 4 h 10 min total

  Run serially that would be 8 h 20 min, so this halves it. dry_run prints both numbers.

  Each step produces two folders, sharing one run number:

    data/A0058_HEA-0GPa_a0022_f003000_rigaku3M/..._r00001.h5
    data/A0058_HEA-0GPa_a0022_f003000_eiger4M/..._r00001.h5

  Each gets its own _metadata.hdf and its own DM job.

  Note the a0022 in that example. The folder suffix comes from the attenuator READBACK, not
  from att_level -- on the last series att_level 20 read back as 22. So expect folders named
  for the achieved attenuation, which may not match the number you asked for. The five steps
  still land in five distinct folders either way.

  To change the attenuation list, add or remove protocol blocks and update the protocols:
  list in the run block to match. They execute in the order listed there.

  ---------------------------------------------------------------------------
  Motion: what a dual run moves, and what it will refuse to move
  ---------------------------------------------------------------------------

  Moves, in this order, once per measurement:

    huber.delta -> 10         setup_huber_for_dual() in dual_master_plan_eiger4m_rigaku3m.py, before any
    huber.nu    ->  0         acquisition starts
    filter_8ide.attenuation   to att_level
    detector.x  -> -250.0     via select_device("rigaku3M_epics")
    detector.y  ->  170.0     same

  Never moves during acquisition, and is refused if you ask:

    Once setup_huber_for_dual() has run, huber.delta and huber.nu are off limits. They are
    rejected in a leg's motors: block -- at validation time and again at run time -- and
    rejected as sample_info.yaml's inner_motor / outer_motor. To change where a dual run
    acquires, edit DUAL_HUBER_DELTA / DUAL_HUBER_NU in dual_master_plan_eiger4m_rigaku3m.py, not this file.

    Note setup_huber_for_dual() is independent of master_plan.py's placeholder_rigaku3M().
    Changing the serial Rigaku placeholder does not move the dual geometry, and vice versa.

    flight_path_8idi.swing is never touched: select_device() only drives horizontal/vertical.

  Note detector.x / detector.y is the stage shared with the Eiger. If the Eiger is bolted to
  it, that move carries the Eiger too -- which is what the geometry comment above is about.
  If both detectors are already positioned, set select_device: no on the Rigaku leg and
  nothing but the attenuator and the two huber axes will move. That is safe for the trigger
  path: setup_rigaku_epics() sets softglue.enable_rigaku = '1' itself.

  ---------------------------------------------------------------------------
  Structure
  ---------------------------------------------------------------------------

  runs / protocols / samples / sample_range / repeats / loop_order behave exactly as in
  measurement_info.yaml -- the expansion code is shared. See that file for those options.

  What differs is the protocol body. A dual protocol splits its settings in two:

    Protocol level, shared, because there is one beam and one sample:
      att_level, num_repeats, wait_time, sample_move, position_reset

    detectors[] level, because these differ per detector:
      device, mode, acq_time, num_frames, qmap_file, analysis_type, geometry, motors

  num_repeats is shared. Repeats run in lockstep: both detectors start each repeat together
  and the faster one waits for the slower before the next begins.

  ---------------------------------------------------------------------------
  Shutter and start order
  ---------------------------------------------------------------------------

  Exactly one detector must set shutter_owner: yes. Per repeat:

    1. Shutter opens.
    2. The shutter owner is armed.
    3. Wait until the owner confirms it is acquiring (Rigaku: detector_state reaches 1).
       This takes a few seconds of internal staging, with the shutter already open.
    4. Only then are the other detectors armed.
    5. Wait for ALL cams to finish, then close the shutter.
    6. Wait for ALL HDF plugins to finish, then write metadata and submit DM for each leg.

  So the shutter is always open before any detector integrates, and never closes while one is
  still going. If the owner does not start within start_timeout seconds the run aborts before
  any other detector is armed, and the shutter closes.

  The Rigaku is the natural owner: its trigger path needs softglue.enable_rigaku = '1', which
  select_device("rigaku3M_epics") and setup_rigaku_epics() both set. Do not run pre_align()
  during a dual run -- it sets that MUX back to '0'.

  ---------------------------------------------------------------------------
  Detector options
  ---------------------------------------------------------------------------

    device / mode:
      Only these pairs are supported for dual acquisition:
        eiger4M         / Internal Series
        rigaku3M_epics  / EPICS

    acq_time, num_frames:
      Per detector. They do not have to match; here they deliberately do.

    qmap_file:
      REQUIRED. No default and no fallback; missing or empty fails at load. The file must
      exist in the experiment's data folder or DM will stall at stage 02-WAIT-QMAP.

    analysis_type:
      Optional, one of Multitau, Twotime, Both. Default Multitau.

    label:
      Optional. Short name used in file paths. Defaults to the canonical detector name, so
      rigaku3M_epics becomes rigaku3M. Only needed if two legs would otherwise collide.

    select_device:
      Optional, default no. Whether to call select_device(), which moves the detector to its
      device_position.yaml preset. Yes for the Rigaku, which owns the Aerotech translation
      stage. Leave it off for the second detector -- both presets cannot be satisfied at once.

    motors:
      Optional. Dotted ophyd paths moved before acquisition, e.g. detector.x: -250. Axes not
      listed stay where they are. huber.delta and huber.nu are rejected here; see the motion
      section above.

    shutter_owner:
      Exactly one leg must set this. See the shutter section above.

    start_timeout:
      Optional, default 30. Seconds to wait for the owner to confirm it is acquiring.

    hdf_timeout:
      Optional, default 300. Seconds to wait for HDF plugins to finish writing after the cams
      stop. Set to 600 here because 3000 frames is a large dataset to flush.

    workflow_name:
      Optional. Overrides the DM workflow for this leg. Defaults to the
      pv_registers.workflow_name register.

  ---------------------------------------------------------------------------
  geometry
  ---------------------------------------------------------------------------

  Optional, and so is every field inside it. Omit the block entirely and this leg's metadata
  comes from device_position.yaml exactly as a single-detector run would. State a field only
  to override it -- useful because in a dual run at most one detector can be at its
  calibrated preset.

  Every field takes a literal number or a dotted ophyd path. A path is read live at metadata
  time, so 'huber.nu' records wherever setup_huber_for_dual() left it. (Reading nu is fine --
  it is moving it from inside the acquisition that is forbidden.)

    db_x, db_y:              Direct-beam pixel position.
    distance:                Sample-to-detector distance, metres.
    pixel_size:              Detector pixel size, metres.
    position_x, position_y:  Detector translation, MILLIMETRES. Written to file in metres.
    beam_center_position_x:  Millimetres. Where the direct beam was calibrated.
    beam_center_position_y:
    swing_horizontal:        Reported as flightpath_swing.
    swing_vertical:          Reported as flightpath_swing_vertical.

  ---------------------------------------------------------------------------
  Testing one detector at a time
  ---------------------------------------------------------------------------

  A detectors: list of length one is legal -- that leg becomes the shutter owner
  automatically, and the run behaves like the serial path with the new folder naming. That is
  the right way to smoke-test each leg before running them together.
