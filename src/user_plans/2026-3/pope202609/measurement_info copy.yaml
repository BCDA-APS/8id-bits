###### Parallel (multi-detector) protocol -- commented example ##############
#
# Uncomment and add `parallel_example` to a run block's protocols: list to use it.
# All three detectors acquire in ONE beam window: the shutter opens once, every
# detector is armed, and it closes only after every cam has finished. They are not
# frame-synced -- they merely overlap -- so the set costs roughly the slowest leg
# rather than the sum of the three.
#
# Only internally-timed modes may appear here (eiger4M/Internal Series,
# lambda2M/Internal, rigaku3M_epics/EPICS). A mode that gates the beam through
# softglue cannot share a window with one that does not.
#
#   parallel_example:
#     att_level: 1
#     num_repeats: 1
#     wait_time: 0
#     sample_move: no
#     position_reset: no
#     detectors:
#       - device: rigaku3M_epics
#         mode: EPICS
#         acq_time: 1
#         num_frames: 10
#         qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
#         analysis_type: Multitau
#         select_device: yes        # this leg owns the Aerotech translation stage
#         start_timeout: 30         # it stages for a few seconds before reporting
#         hdf_timeout: 600
#       - device: eiger4M
#         mode: Internal Series
#         acq_time: 1
#         num_frames: 10
#         qmap_file: eiger4m_qmap_4m.hdf
#         analysis_type: Multitau
#         hdf_timeout: 600
#       - device: lambda2M
#         mode: Internal
#         acq_time: 1
#         num_frames: 10
#         qmap_file: lambda2m_qmap_default.hdf
#         analysis_type: Multitau
#         hdf_timeout: 600
#
# Each leg gets its own folder, its own _metadata.hdf and its own DM job, all
# sharing one measurement number:
#
#   data/A0061_Test_a0001_f000010_rigaku3M_r00001.h5
#   data/A0061_Test_a0001_f000010_eiger4M_r00001.h5
#   data/A0061_Test_a0001_f000010_lambda2M_r00001.h5
#
