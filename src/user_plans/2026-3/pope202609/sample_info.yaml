defaults:
  inner_motor: huber.x
  outer_motor: huber.y
  inner_range: 0.005
  outer_range: 0.00
  inner_pts: 350
  outer_pts: 1

samples:

  # Attenuation test: one fixed spot, no mesh. Every protocol in
  # dual_measurement_info.yaml sets sample_move: no, so nothing moves during the
  # run -- the single point below is only what select_sample(1) drives to.
  sample_1:
    sample_name: EHEA-Mesh
    header: E
    inner_center: -0.208
    outer_center: 21.295
    inner_range: 0.0
    outer_range: 0.0
    inner_pts: 1
    outer_pts: 1

