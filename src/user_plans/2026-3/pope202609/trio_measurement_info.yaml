_instructions: |
  Runs the Rigaku, the Eiger and the Lambda in the same beam window instead of back to back.
  They are NOT frame-synced -- the acquisitions merely overlap, so a set of long measurements
  costs roughly the slowest one rather than the sum of all of them. The Rigaku owns the
  shutter and is armed first; the Eiger and the Lambda follow a second or two later, once it
  confirms it is acquiring. That offset is deliberate and is not corrected for.

  To run:

    dry_run_trio_measurement_info(check_hardware=True)    # validate + preview, moves nothing
    run_trio_measurement_info()                           # go

  Both are imported by startup.py, so they are available in the session already.

  ---------------------------------------------------------------------------
  Live/TV mode: stop it, or your exposure time is silently wrong
  ---------------------------------------------------------------------------

  A detector left free-running -- from its own GUI, or from tv_mode() -- IGNORES a write to
  acquire_time. Before this was guarded, a measurement started on top of a live view ran at
  the LIVE VIEW's exposure, wrote its frames, and recorded the exposure you asked for in the
  metadata. Nothing looked wrong; the real exposure was simply lost.

  Every repeat now does two things about it, both before the shutter opens, so a failure
  costs no beam:

    1. Presses Stop on all three detectors and waits for them (stop_timeout, default 10 s).
    2. Reads each camera's acquire_time READBACK and refuses to run if it is not what this
       file asked for (5% tolerance, for the detectors' own rounding).

  So you no longer have to remember to close the TV view first. If a detector will not stop,
  the run aborts and names it.

  tv_mode() itself is the supported way to run a live view on all three at once. It writes
  nothing and consumes no measurement number:

    tv_mode()                              # 5000 frames of 1 s on all three
    tv_mode(detectors=["lambda2M"])        # just one

  It opens the beam and blocks the session -- set att() first -- and Ctrl+C presses Stop on
  every detector and closes the shutter.

  ---------------------------------------------------------------------------
  What this file currently does
  ---------------------------------------------------------------------------

  An ATTENUATION TEST. Sample 1, one fixed spot, three measurements in this order:

    att_level 5 -> 2 -> 1                    (most attenuated first)

  att_level 10 removed 2026-09-11 -- stuck filter, see the comment above the protocols.

  The four protocols are byte-identical apart from att_level, so the only variable across
  the series is the attenuation. Every one sets sample_move: no, so the sample never moves
  and all four sample the same illuminated volume. Drive to the spot first:

    select_sample(1)      # huber.x -> -0.208, huber.y -> 21.295

  sample_info.yaml sample_1 is a single point (inner_pts / outer_pts 1, ranges 0), not the
  21 x 21 EHEA mesh -- restore that block before going back to the grid map.

  Each runs ALL THREE detectors in parallel at 1 s per frame, 3000 frames:

    3000 s = 50 min of beam per attenuation step
    3 steps = 2 h 30 min total

  Run serially that would be 7 h 30 min, so this cuts it to a third. dry_run prints both
  numbers.

  Each step produces three folders, sharing one run number:

    data/A0058_HEA-0GPa_a0022_f003000_rigaku3M/..._r00001.h5
    data/A0058_HEA-0GPa_a0022_f003000_eiger4M/..._r00001.h5
    data/A0058_HEA-0GPa_a0022_f003000_lambda2M/..._r00001.h5

  Each gets its own _metadata.hdf and its own DM job.

  Note the a0022 in that example. The folder suffix comes from the attenuator READBACK, not
  from att_level -- on the last series att_level 20 read back as 22. So expect folders named
  for the achieved attenuation, which may not match the number you asked for. The five steps
  still land in five distinct folders either way.

  To change the attenuation list, add or remove protocol blocks and update the protocols:
  list in the run block to match. They execute in the order listed there.

  ---------------------------------------------------------------------------
  Motion: what a trio run moves, and what it will refuse to move
  ---------------------------------------------------------------------------

  NO DETECTOR IS MOVED by this file as it stands. Position all three yourself before running.

  What would move, if it were enabled:

    huber.delta -> 10         setup_huber_for_trio() in trio_master_plan_rigaku3m_eiger4m_lambda2m.py --
    huber.nu    ->  0         its motion is COMMENTED OUT, so neither axis moves today
    filter_8ide.attenuation   to att_level -- this one does happen, every measurement
    detector.x  -> -275.0     via select_device("rigaku3M_epics") -- but rigaku3M has
    detector.y  ->  170.0     allow_motion: false in device_position.yaml, so it does not move

  So the only thing a run actually drives is the attenuator. All three detectors have
  allow_motion: false, and no leg below has a motors: block.

  Never moves during acquisition, and is refused if you ask:

    Once setup_huber_for_trio() has run, huber.delta and huber.nu are off limits. They are
    rejected in a leg's motors: block -- at validation time and again at run time -- and
    rejected as sample_info.yaml's inner_motor / outer_motor. To change where a trio run
    acquires, edit TRIO_HUBER_DELTA / TRIO_HUBER_NU in trio_master_plan_rigaku3m_eiger4m_lambda2m.py, not this file.

    Note setup_huber_for_trio() is independent of master_plan.py's placeholder_rigaku3M().
    Changing the serial Rigaku placeholder does not move the trio geometry, and vice versa.

    flight_path_8idi.swing is never touched: select_device() only drives horizontal/vertical.

  Note detector.x / detector.y is the stage shared with the Eiger. If the Eiger is bolted to
  it, that move carries the Eiger too -- which is what the geometry comment above is about.
  If all three detectors are already positioned, set select_device: no on the Rigaku leg and
  nothing but the attenuator will move. That is safe for the trigger
  path: setup_rigaku_epics() sets softglue.enable_rigaku = '1' itself.

  ---------------------------------------------------------------------------
  Structure
  ---------------------------------------------------------------------------

  runs / protocols / samples / sample_range / repeats / loop_order behave exactly as in
  measurement_info.yaml -- the expansion code is shared. See that file for those options.

  What differs is the protocol body. A trio protocol splits its settings in two:

    Protocol level, shared, because there is one beam and one sample:
      att_level, num_repeats, wait_time, sample_move, position_reset

    detectors[] level, because these differ per detector:
      device, mode, acq_time, num_frames, qmap_file, analysis_type, geometry, motors

  num_repeats is shared. Repeats run in lockstep: every detector starts each repeat together
  and the faster ones wait for the slowest before the next begins.

  ---------------------------------------------------------------------------
  Shutter and start order
  ---------------------------------------------------------------------------

  Exactly one detector must set shutter_owner: yes -- the Rigaku, here. Per repeat:

    1. Shutter opens.
    2. The shutter owner is armed.
    3. Wait until the owner confirms it is acquiring (Rigaku: detector_state reaches 1).
       This takes a few seconds of internal staging, with the shutter already open.
    4. Only then are the other detectors armed, in the order they are listed above. Each arm
       is a single EPICS put, so the Eiger and the Lambda start within a moment of each other,
       both of them a second or two after the Rigaku.
    5. Wait for ALL cams to finish, then close the shutter.
    6. Wait for ALL HDF plugins to finish, then write metadata and submit DM for each leg.

  So the shutter is always open before any detector integrates, and never closes while one is
  still going. If the owner does not start within start_timeout seconds the run aborts before
  any other detector is armed, and the shutter closes.

  The Rigaku is the natural owner: its trigger path needs softglue.enable_rigaku = '1', which
  select_device("rigaku3M_epics") and setup_rigaku_epics() both set. Do not run pre_align()
  during a trio run -- it sets that MUX back to '0'.

  ---------------------------------------------------------------------------
  Detector options
  ---------------------------------------------------------------------------

    device / mode:
      Only these pairs are supported for trio acquisition:
        eiger4M         / Internal Series
        lambda2M        / Internal
        rigaku3M_epics  / EPICS

      lambda2M / External is deliberately NOT supported: it gates the shutter through
      softglue, one pulse per frame, which cannot coexist with a Rigaku-owned shutter window.

    acq_time, num_frames:
      Per detector. They do not have to match; here they deliberately do.

    qmap_file:
      REQUIRED. No default and no fallback; missing or empty fails at load. The file must
      exist in the experiment's data folder or DM will stall at stage 02-WAIT-QMAP.

    analysis_type:
      Optional, one of Multitau, Twotime, Both. Default Multitau.

    label:
      Optional. Short name used in file paths. Defaults to the canonical detector name, so
      rigaku3M_epics becomes rigaku3M. Only needed if two legs would otherwise collide.

    select_device:
      Optional, default no. Whether to call select_device(), which moves the detector to its
      device_position.yaml preset. Yes for the Rigaku, which owns the Aerotech translation
      stage. Leave it off for the other legs -- their presets cannot all be satisfied at once.
      (With allow_motion: false on all three entries it currently moves nothing either way; it
      still writes the entry's registers: block and sets expt.det_name.)

    motors:
      Optional. Dotted ophyd paths moved before acquisition, e.g. detector.x: -250. Axes not
      listed stay where they are. huber.delta and huber.nu are rejected here; see the motion
      section above.

    shutter_owner:
      Exactly one leg must set this. See the shutter section above.

    start_timeout:
      Optional, default 30. Seconds to wait for the owner to confirm it is acquiring.

    stop_timeout:
      Optional, default 10. Seconds to wait for this detector to come OUT of live/TV mode
      before its parameters are written. See the live-mode note at the bottom of this file.

    hdf_timeout:
      Optional, default 300. Seconds to wait for HDF plugins to finish writing after the cams
      stop. Set to 600 here because 3000 frames is a large dataset to flush.

    workflow_name:
      Optional. Overrides the DM workflow for this leg. Defaults to the
      pv_registers.workflow_name register.

  ---------------------------------------------------------------------------
  geometry
  ---------------------------------------------------------------------------

  Optional, and so is every field inside it. Omit the block entirely and this leg's metadata
  comes from device_position.yaml exactly as a single-detector run would. State a field only
  to override it -- useful because in a trio run at most one detector can be at its
  calibrated preset.

  Every field takes a literal number or a dotted ophyd path. A path is read live at metadata
  time, so 'huber.nu' records wherever setup_huber_for_trio() left it. (Reading nu is fine --
  it is moving it from inside the acquisition that is forbidden.)

    db_x, db_y:              Direct-beam pixel position.
    distance:                Sample-to-detector distance, metres.
    pixel_size:              Detector pixel size, metres.
    position_x, position_y:  Detector translation, MILLIMETRES. Written to file in metres.
    beam_center_position_x:  Millimetres. Where the direct beam was calibrated.
    beam_center_position_y:
    swing_horizontal:        Reported as flightpath_swing.
    swing_vertical:          Reported as flightpath_swing_vertical.

  ---------------------------------------------------------------------------
  Testing one detector at a time
  ---------------------------------------------------------------------------

  A detectors: list of length one is legal -- that leg becomes the shutter owner
  automatically, and the run behaves like the serial path with the new folder naming. That is
  the right way to smoke-test each leg before running them together.
