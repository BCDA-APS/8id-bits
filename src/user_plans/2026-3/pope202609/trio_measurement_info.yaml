loop_order: sample_major

runs:
 - name: trio_att_series
   samples: [1]
  #  protocols: [trio_att5, trio_att2, trio_att1]
   protocols: [trio_att1]
   repeats: 1

###### Change here to change measurement conditions #######

# The three protocols below are identical apart from att_level, and run in the order listed in
# the run block above: 5, 2, 1. There is no YAML anchor here on purpose, so a change
# to acq_time, num_frames or a qmap has to be made in all three.
#
# att_level 10 was dropped on 2026-09-11: a stuck filter left attenuation_actual at 1.78
# with the setpoint at 10, so E0160 ran at the wrong attenuation. Restore the trio_att10
# block once the filter set is fixed.
#
# THREE detectors per protocol since 2026-09-11: rigaku3M_epics, eiger4M and lambda2M all run
# in one beam window. The Rigaku still owns the shutter and is armed first; the other two are
# armed once it confirms it is acquiring, so they start a second or two late. That offset is
# accepted -- nothing here is frame-synced.
#
# Before the first three-detector run, check that lambda2m_qmap_default.hdf really is in the
# experiment data folder. dry_run_trio_measurement_info() now checks every leg's qmap and will
# say so if it is missing or named differently; fix the name here rather than running without.
#
# Beam-centre metadata for the two non-Rigaku legs: with no geometry block their metadata comes
# from device_position.yaml -- eiger4M db_x 716, db_y 815, distance 4 m; lambda2M db_x 779,
# db_y 987, distance 2.2 m. Those were calibrated with the Aerotech stage at the detector's own
# preset. In a trio run the Rigaku owns that stage and it sits at -275 / 170, so those numbers
# probably do not describe this measurement. Raw frames are unaffected; only the _metadata.hdf
# is. To correct it, add a geometry: block to the leg -- fields documented at the bottom.

protocols:

  trio_att5:
    att_level: 5
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        acq_time: 1
        num_frames: 10
        qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
        analysis_type: Multitau
        select_device: yes
        shutter_owner: yes
        start_timeout: 30
        hdf_timeout: 600
      - device: eiger4M
        mode: Internal Series
        acq_time: 1
        num_frames: 20
        qmap_file: eiger4m_qmap_Sx72_Dx6.hdf
        analysis_type: Multitau
        hdf_timeout: 600
      - device: lambda2M
        mode: Internal
        acq_time: 1
        num_frames: 30
        qmap_file: lambda2m_qmap_default.hdf
        analysis_type: Multitau
        hdf_timeout: 600

  trio_att2:
    att_level: 2
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        acq_time: 1
        num_frames: 3000
        qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
        analysis_type: Multitau
        select_device: yes
        shutter_owner: yes
        start_timeout: 30
        hdf_timeout: 600
      - device: eiger4M
        mode: Internal Series
        acq_time: 1
        num_frames: 3000
        qmap_file: eiger4m_qmap_Sx72_Dx6.hdf
        analysis_type: Multitau
        hdf_timeout: 600
      - device: lambda2M
        mode: Internal
        acq_time: 1
        num_frames: 3000
        qmap_file: lambda2m_qmap_default.hdf
        analysis_type: Multitau
        hdf_timeout: 600

  trio_att1:
    att_level: 1
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        acq_time: 1
        num_frames: 10
        qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
        analysis_type: Multitau
        select_device: yes
        shutter_owner: yes
        start_timeout: 30
        hdf_timeout: 600
      - device: eiger4M
        mode: Internal Series
        acq_time: 1
        num_frames: 10
        qmap_file: eiger4m_qmap_4m.hdf
        analysis_type: Multitau
        hdf_timeout: 600
      - device: lambda2M
        mode: Internal
        acq_time: 1
        num_frames: 10
        qmap_file: lambda2m_qmap_default.hdf
        analysis_type: Multitau
        hdf_timeout: 600

