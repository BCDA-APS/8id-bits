# Detector acquisition protocols, and which samples they run on.
# Read by run_measurement_info() in id8_common/plans/acquire/master_plan.py.
#
# Full reference -- every field, every detector mode, timing rules and worked
# examples -- lives in docs/running-measurements.md.
# Validate any edit with dry_run_measurement_info() before running it.

loop_order: sample_major

################ Change here to run measurements ################

runs:
 - name: mode_test
   samples: [1]
   protocols:
    #  - eiger_internal_series
    #  - eiger_internal_enable
    #  - eiger_external_enable
    #  - eiger_external_series
     - rigaku_epics
    #  - rigaku_zdt_2bit
    #  - rigaku_ftf_2bit
   repeats: 1

###### Change here to change measurement conditions #######

# Five short protocols, one per acquisition mode under test. All are sized to
# run in seconds rather than minutes, and all use sample_move: no so a mode
# test never drives the sample stage.

protocols:

  # ---------------------------------------------------------------- eiger4M
  eiger_internal_series:
    detector: eiger4M
    mode: Internal Series
    att_level: 2
    # The eiger detector paces its own frames, so acq_period is not used and
    # must be left out -- det_acq_series() sets it equal to acq_time.
    acq_time: 0.01
    num_frames: 100
    num_repeats: 3
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: eiger4m_qmap_default.hdf

  # Internally timed, but ONE SOFTWARE TRIGGER PER FRAME
  # (cam.special_trigger_button in a loop, paced by acq_period). That cannot be
  # pushed the way the internally paced modes can: at acq_period 0.02 s the
  # Eiger serviced only 12 of 100 triggers and the acquire loop hung waiting for
  # frames that were never taken (observed 2026-09-04). 10 x 2 s = 20 s.
  eiger_internal_enable:
    detector: eiger4M
    mode: Internal Enable
    att_level: 2
    acq_time: 1
    acq_period: 2
    num_frames: 10
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: eiger4m_qmap_default.hdf

  eiger_external_enable:
    detector: eiger4M
    mode: External Enable
    att_level: 2
    # One softglue pulse per frame, and that same pulse holds the shutter open,
    # so both acq_time and acq_period must be >= 0.1 s -- the shutter cannot
    # follow faster. 20 frames x 0.2 s = 4 s of shutter cycling.
    acq_time: 0.1
    acq_period: 0.2
    num_frames: 20
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: eiger4m_qmap_default.hdf

  eiger_external_series:
    detector: eiger4M
    mode: External Series
    att_level: 2
    # num_frames is PER SEGMENT here, and num_segments is how many softglue
    # pulses are sent -- 10 x 3 = 30 frames written to the file. Within a
    # segment the eiger paces itself, so there is no 0.1 s floor on acq_period.
    #
    # trigger_period must clear the segment by at least the 0.1 s the shutter
    # needs to move: segment = num_frames * acq_period = 10 * 0.2 = 2 s, so
    # trigger_period >= 2.1 s. At 3 s the shutter is open 2 s and closed 1 s
    # per segment. Too short and the next pulse lands mid-segment, is dropped,
    # and the acquisition hangs waiting for a trigger already spent.
    acq_time: 0.1
    acq_period: 0.2
    num_frames: 10
    num_segments: 3
    trigger_period: 3
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: eiger4m_qmap_default.hdf

  # --------------------------------------------------------------- rigaku3M
  # The two rigaku protocols below are the same acquisition -- same mode name,
  # timing and resolution. Only `detector` differs, and that is what selects
  # the output format: rigaku3M writes the sparsified .bin, rigaku3M_ftf writes
  # fast-transfer HDF5. Both emit <file_name>.bin.000 .. .bin.005.
  rigaku_zdt_2bit:
    detector: rigaku3M
    mode: ZDT2bit
    att_level: 2
    # 2e-5 s is the floor for 2 bit (4e-5 for ZDT4bit, 8e-5 for ZDT8bit).
    acq_time: 0.00002
    num_frames: 100000
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: rigaku3m_qmap_default.hdf

  # Standard areaDetector acquisition through the HDF1 plugin -- neither
  # fast-file format. Writes <file_name>.h5. This is the only rigaku mode that
  # arms and drains HDF1, so it is the one that exercises the same plugin path
  # the eiger modes use. needs_acq_period is False, so acq_period is omitted;
  # min_acq_time for this mode is 0.01 s.
  rigaku_epics:
    detector: rigaku3M_epics
    mode: EPICS
    att_level: 10
    acq_time: 0.01
    num_frames: 1000
    num_repeats: 1
    wait_time: 0
    sample_move: yes
    position_reset: yes
    analysis_type: Multitau
    qmap_file: rigaku3m_qmap_Sq360_Dq36_lin.hdf

  rigaku_ftf_2bit:
    detector: rigaku3M_ftf
    mode: ZDT2bit
    att_level: 2
    acq_time: 0.00002
    num_frames: 100000
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: rigaku3m_qmap_default.hdf


