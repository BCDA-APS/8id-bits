# Detector acquisition protocols, and which samples they run on.
# Read by run_measurement_info() in id8_common/plans/acquire/master_plan.py.
#
# Full reference -- every field, every detector mode, timing rules and worked
# examples -- lives in docs/running-measurements.md.
# Validate any edit with dry_run_measurement_info() before running it.
#
# A protocol takes one of two shapes:
#
#   detector: / mode:   one detector at a time. Every protocol below is this one.
#   detectors:          a LIST of detectors run in the same beam window. See the
#                       commented parallel_example at the bottom of this file, and
#                       trio_measurement_info.yaml, which is where the parallel
#                       protocols for this experiment actually live.
#
# Both shapes work in either file since 2026-09-11, when parallel acquisition
# folded into master_plan.py. Add `check_hardware=True` to the dry run to check a
# parallel protocol's devices as well as its fields.

loop_order: sample_major

################ Change here to run measurements ################

runs:
 - name: mode_test
   samples: [1]
   protocols:
     - eiger_rigaku_lambda_parallel
   repeats: 1

###### Change here to change measurement conditions #######

# Five short protocols, one per acquisition mode under test. All are sized to
# run in seconds rather than minutes, and all use sample_move: no so a mode
# test never drives the sample stage.

protocols:

  eiger_rigaku_lambda_parallel:
    att_level: 10
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    detectors:
      - device: rigaku3M_epics
        mode: EPICS
        acq_time: 1
        num_frames: 10
        qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
        analysis_type: Multitau
        select_device: yes        # this leg owns the Aerotech translation stage
        start_timeout: 30         # it stages for a few seconds before reporting
        hdf_timeout: 600
      - device: eiger4M
        mode: Internal Series
        acq_time: 1
        num_frames: 10
        qmap_file: eiger4m_qmap_4m.hdf
        analysis_type: Multitau
        hdf_timeout: 600
      - device: lambda2M
        mode: Internal
        acq_time: 1
        num_frames: 10
        qmap_file: lambda2m_qmap_default.hdf
        analysis_type: Multitau
        hdf_timeout: 600


###### Change here to change measurement conditions #######


###### Parallel (multi-detector) protocol -- commented example ##############
#
# Uncomment and add `parallel_example` to a run block's protocols: list to use it.
# All three detectors acquire in ONE beam window: the shutter opens once, every
# detector is armed, and it closes only after every cam has finished. They are not
# frame-synced -- they merely overlap -- so the set costs roughly the slowest leg
# rather than the sum of the three.
#
# Only internally-timed modes may appear here (eiger4M/Internal Series,
# lambda2M/Internal, rigaku3M_epics/EPICS). A mode that gates the beam through
# softglue cannot share a window with one that does not.
#
#   parallel_example:
#     att_level: 1
#     num_repeats: 1
#     wait_time: 0
#     sample_move: no
#     position_reset: no
#     detectors:
#       - device: rigaku3M_epics
#         mode: EPICS
#         acq_time: 1
#         num_frames: 10
#         qmap_file: rigaku3m_qmap_Sq360_Dq36_NoStreak_lin.hdf
#         analysis_type: Multitau
#         select_device: yes        # this leg owns the Aerotech translation stage
#         start_timeout: 30         # it stages for a few seconds before reporting
#         hdf_timeout: 600
#       - device: eiger4M
#         mode: Internal Series
#         acq_time: 1
#         num_frames: 10
#         qmap_file: eiger4m_qmap_4m.hdf
#         analysis_type: Multitau
#         hdf_timeout: 600
#       - device: lambda2M
#         mode: Internal
#         acq_time: 1
#         num_frames: 10
#         qmap_file: lambda2m_qmap_default.hdf
#         analysis_type: Multitau
#         hdf_timeout: 600
#
# Each leg gets its own folder, its own _metadata.hdf and its own DM job, all
# sharing one measurement number:
#
#   data/A0061_Test_a0001_f000010_rigaku3M_r00001.h5
#   data/A0061_Test_a0001_f000010_eiger4M_r00001.h5
#   data/A0061_Test_a0001_f000010_lambda2M_r00001.h5
