_instructions: |
  This file defines detector acquisition protocols and assigns them to samples.

  Main structure:
    loop_order:
      Optional top-level default loop order.
      If a run block does not specify loop_order, this value is used.
      Recommended default: sample_major.

    runs:
      Defines what samples are measured and which protocols are applied.
      Keep only the run blocks you actually want to execute.

    protocols:
      Defines reusable acquisition settings.
      A run block references protocols by name.

  Run block options:
    name:
      Human-readable name for the run block.

    sample_range:
      Consecutive sample indices.
      Example:
        sample_range: [1, 26]
      means samples 1 through 26.

    samples:
      Explicit list of sample indices.
      Example:
        samples: [1, 5, 10, 15]

    protocols:
      List of protocol names to apply to the selected samples.
      Each listed protocol must exist under the protocols section.

    repeats:
      Number of times to repeat the entire run block.

      This is different from num_repeats:
        num_repeats:
          Number of repeated acquisitions inside one det_acq_series() call.

        runs[].repeats:
          Number of times the sample/protocol assignment is repeated.
          Each repeat creates new measurement folders.

      For repeats > 1:
        position_reset is only applied on repeat 1.
        Repeat 2, 3, etc. continue from the current sample-position register.

    loop_order:
      Optional per-run override of the top-level loop_order.

      sample_major:
        For each sample, run all selected protocols before moving to the next sample.

      protocol_major:
        For each protocol, run all selected samples before moving to the next protocol.

  Protocol options:
    detector:
      Supported values:
        eiger4M
        lambda2M
        rigaku3M
        rigaku3M_epics

    mode:
      Supported detector/mode combinations:
        eiger4M:
          Internal Series
          External Enable

        lambda2M:
          Internal

        rigaku3M:
          ZDT      (min acq_time: 20e-6 s)
          ZDT4bit  (min acq_time: 40e-6 s)
          ZDT8bit  (min acq_time: 80e-6 s)

        rigaku3M_epics:
          EPICS

    att_level:
      Attenuation level passed to att(att_level).

    acq_time:
      Detector acquisition time per frame.

    acq_period:
      Required only for modes that need external timing.
      Currently required for:
        eiger4M, External Enable

    num_frames:
      Number of frames in one acquisition.

    num_repeats:
      Number of repeated acquisitions inside one det_acq_series() call.

    wait_time:
      Wait time before each repeated acquisition.

    sample_move:
      yes:
        Move to a new mesh point before each repeated acquisition.

      no:
        Do not move the sample.

    position_reset:
      yes:
        Reset this sample's mesh-position register to -1 before this protocol starts.
        Because ad_acq.py uses next_position = last_position + 1, the first
        measured mesh index is 0.

      no:
        Do not reset the mesh-position register.
        The sample continues from its previous mesh position.

      Important:
        For runs[].repeats > 1, position_reset is applied only on repeat 1.
        Repeat 2, 3, etc. continue from the previous mesh position.

  Active example in this file:
    The active runs block uses sample_range [1, 26], applies only fast_xpcs,
    uses the default top-level loop_order sample_major, and starts the mesh from
    the beginning because fast_xpcs has position_reset: yes.

  To test two protocols with protocol_major ordering, replace the runs block with:

    runs:
      - name: selected_samples_two_protocols
        samples: [1, 5, 10]
        protocols:
          - fast_xpcs
          - slow_xpcs
        repeats: 1
        loop_order: protocol_major