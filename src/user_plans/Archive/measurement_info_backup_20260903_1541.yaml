################ Change here to run measurements ################

runs:
 - name: test
   samples: [1]
   protocols:
     - eiger_external_series
   repeats: 1

###### Change here to change measurement conditions #######

protocols:

  eiger_external_series:
    detector: eiger4M
    mode: External Series
    att_level: 2
    acq_time: 1
    acq_period: 2
    # num_frames is PER SEGMENT in this mode, and num_segments is how many
    # softglue pulses are sent -- 10 x 5 = 50 frames written to the file.
    # trigger_period is the gap between those pulses and must be longer than
    # one segment (num_frames * acq_period = 10 * 2 = 20 s), or the next pulse
    # lands mid-segment and is dropped. External Series is the only mode that
    # takes num_segments (defaults to 1) and trigger_period (required).
    num_frames: 10
    num_segments: 5
    trigger_period: 30
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: no
    analysis_type: Multitau
    qmap_file: eiger4m_qmap_default.hdf

  eiger_att2:
    detector: eiger4M
    mode: Internal Series
    att_level: 2
    acq_time: 1.0
    num_frames: 1000
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    analysis_type: Both
    qmap_file: eiger4m_qmap_default.hdf

  rigaku_att2:
    detector: rigaku3M_epics
    mode: EPICS
    att_level: 2
    acq_time: 0.01
    num_frames: 1000
    num_repeats: 5
    wait_time: 0
    sample_move: yes
    position_reset: yes
    analysis_type: Both
    qmap_file: rigaku3m_qmap_A0057_r00001.hdf


  rigaku_zdt:
    detector: rigaku3M
    mode: ZDT2bit
    att_level: 2
    acq_time: 0.00002
    num_frames: 100000
    num_repeats: 1
    wait_time: 0
    sample_move: no
    position_reset: yes
    analysis_type: Multitau
    qmap_file: rigaku3m_qmap_A0057_r00001.hdf

