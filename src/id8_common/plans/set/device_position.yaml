# Stage positions for select_device().
#
# motors: list of named axis entries — supports any number of axes.
#   name: axis role (horizontal, vertical, swing_angle_horizontal, swing_angle_vertical, ...).
#   device: dotted "registry_key.attribute" path, or null if the axis doesn't physically
#     exist on this detector.
#   position: direct-beam preset that select_device() moves horizontal/vertical to when
#     this detector is selected. select_device() moves ONLY horizontal/vertical
#     (TRANSLATION_AXES in select_device.py) — it never moves swing_angle_horizontal/
#     vertical, even when a device is configured for them. This is why `position` is
#     omitted entirely below wherever there's nothing for select_device() to do with it:
#     null-device axes (nothing to move), and all of lambda2M's axes (no translation
#     stage, and its swing motors are select-only-on-request, same as everyone else's).
#
#   Swing angles are only ever moved explicitly, via move_detector_axes() / a
#   measurement_info.yaml protocol's horizontal/vertical/swing_angle_horizontal/
#   swing_angle_vertical overrides (see id8_common/plans/acquire/master_plan.py:
#   run_measurement). If a protocol doesn't specify a swing axis, it is left wherever it
#   currently is — there is no default/reset position for it in this file. This is
#   deliberate: the flight-path swing (eiger4M/rigaku3M's flight_path_8idi.swing) is a
#   finicky motor shared across detectors, and should not be driven unless a measurement
#   actually needs it moved.
#
# db_x/db_y (detectors only): direct-beam pixel position. Measured with both swing angles
#   at 0 for every detector — there is no separate beam-center-swing metadata field
#   (see id8_common/utils/nexus_utils.py) because that swing=0 assumption is baked into
#   the db_x/db_y calibration itself.
# registers (detectors only, optional): dotted-path → value written via .put() before
#   motion. Real ophyd signals only. NO DETECTOR USES IT as of 2026-09-14 -- the block is
#   kept because it lets a per-detector signal preset be added from YAML alone. Its last
#   user was softglue.enable_rigaku, which moved into the acquisition modes
#   (set_rigaku_mux() in plans/acquire/acq_helpers.py): the MUX state depends on the mode
#   about to run, not on which detector is selected, and this block cannot express that.
# pixel_size (detectors only): detector pixel size, metres. Read by
#   id8_common/utils/nexus_utils.py and written to /entry/instrument/detector_1/x,y_pixel_size.
# allow_motion: whether this entry's motors may be driven at all. Defaults to true when
#   the field is absent. Set it to false to make an entry selectable but stationary —
#   select_device() still writes registers, beam-centre and det_name, it just skips the
#   translation move, and move_detector_axes() raises instead of driving an axis. Intended
#   for test/commissioning, where selecting a detector must not risk a collision. For a
#   sample_env, false also leaves the valve closed, since the valve only exists to gate
#   motion. Honoured by id8_common/plans/set/select_device.py.
# valve (sample_envs only): dotted path to a device whose .put(1/0) gates motion.
# distance (detectors only): sample-to-detector distance, metres. Read by
#   id8_common/utils/nexus_utils.py and written to /entry/instrument/detector_1/distance.
#
# rigaku3M_epics and rigaku3M_ftf are the same physical detector as rigaku3M and have no
# entry of their own: both are DETECTOR_ALIASES of it (see
# id8_common/plans/set/select_device.py). rigaku3M_epics had a duplicate entry here from
# 2026-09-11 to 2026-09-14, identical but for registers.softglue.enable_rigaku; that value
# now comes from the mode, so the duplicate is gone.
#
# Every detector below is selectable via select_device() and has a full motors/db_x/db_y/
# distance block, even where some axes don't physically exist (device: null) —
# e.g. lambda2M has no horizontal/vertical translation stage, only swing angles.

detectors:

  eiger4M:
    motors:
      - name: horizontal
        device: null
        position: 256.0
      - name: vertical
        device: null
        position: 77.0
      - name: swing_angle_horizontal
        device: huber.nu
      - name: swing_angle_vertical
        device: huber.delta
    db_x: 716.0
    db_y: 815.0
    distance: 4.0
    pixel_size: 75.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

  rigaku3M:
    motors:
      - name: horizontal
        device: detector.x
        position: -275.0
      - name: vertical
        device: detector.y
        position: 170.0
      - name: swing_angle_horizontal
        device: flight_path_8idi.swing
      - name: swing_angle_vertical
        device: null
    db_x: 1052
    db_y: 852
    distance: 22
    pixel_size: 76.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

  lambda2M:
    motors:
      - name: horizontal
        device: null
      - name: vertical
        device: null
      - name: swing_angle_horizontal
        device: huber.nu
      - name: swing_angle_vertical
        device: huber.delta
    db_x: 779.0
    db_y: 987.0
    distance: 2.2
    pixel_size: 55.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

diagnostics:

  microscope:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: 155
      - device: cam_stage_8idi.y
        position: 2.6

  pind:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: 100
      - device: cam_stage_8idi.y
        position: 2.6

  wavefront:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: -19.02
      - device: cam_stage_8idi.y
        position: 2.6

sample_envs:

  qnw:
    allow_motion: true
    motors:
      - device: granite.x
        position: 923.0
    valve: granite_8idi_valve.enable

  rheometer:
    allow_motion: true
    motors:
      - device: granite.x
        position: 73.7
    valve: granite_8idi_valve.enable

  robot:
    allow_motion: true
    motors:
      - device: granite.x
        position: 62.0
    valve: granite_8idi_valve.enable
