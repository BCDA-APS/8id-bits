# Stage positions for select_device().
#
# motors: list of named axis entries — supports any number of axes.
#   name: axis role (horizontal, vertical, swing_angle_horizontal, swing_angle_vertical, ...).
#   device: dotted "registry_key.attribute" path, or null if the axis doesn't physically
#     exist on this detector.
#   position: where select_device() drives this axis when the detector is selected.
#     ONE RULE, every axis alike: it is driven when it has BOTH a real device and a
#     position AND the entry's allow_motion is true. Leave `position` out and the axis is
#     never driven — it stays wherever it is. No axis is excluded by name any more: until
#     2026-09-14 select_device() moved horizontal/vertical only, and a swing angle needed
#     a separate move_detector_axes() call fed by per-protocol overrides in
#     measurement_info.yaml. Both are gone, and those protocol keys are now rejected.
#
#     NO SWING AXIS HAS A POSITION BELOW, so in practice nothing about the swing angles
#     has changed — but give one a position and it WILL be driven. Think first:
#     flight_path_8idi.swing and the huber (delta/nu) are shared across detectors, and in
#     a parallel measurement the huber axes belong to setup_huber_for_multi() for the
#     whole run (a leg with select_device: yes is refused at validation if its entry
#     would drive them).
#
#     A position on a null-device axis moves nothing and is metadata only: eiger4M's
#     horizontal/vertical are read as beam_center_position_x/y by utils/nexus_runtime.py.
#
# db_x/db_y (detectors only): direct-beam pixel position. Measured with both swing angles
#   at 0 for every detector — there is no separate beam-center-swing metadata field
#   (see id8_common/utils/nexus_utils.py) because that swing=0 assumption is baked into
#   the db_x/db_y calibration itself.
# pixel_size (detectors only): detector pixel size, metres. Read by
#   id8_common/utils/nexus_utils.py and written to /entry/instrument/detector_1/x,y_pixel_size.
# allow_motion: whether this entry's motors may be driven at all. Defaults to true when
#   the field is absent. Set it to false to make an entry selectable but stationary —
#   select_device() still records det_name, it just skips the motion. Intended for test/commissioning, where selecting a detector must not risk a
#   collision. For a sample_env, false also leaves the valve closed, since the valve only
#   exists to gate motion. Honoured by id8_common/plans/set/select_device.py.
# valve (sample_envs only): dotted path to a device whose .put(1/0) gates motion.
# distance (detectors only): sample-to-detector distance, metres. Read by
#   id8_common/utils/nexus_utils.py and written to /entry/instrument/detector_1/distance.
#
# rigaku3M_epics and rigaku3M_ftf are the same physical detector as rigaku3M and have no
# entry of their own: both are DETECTOR_ALIASES of it (see
# id8_common/plans/set/select_device.py). rigaku3M_epics had a duplicate entry here from
# 2026-09-11 to 2026-09-14, identical but for registers.softglue.enable_rigaku; that value
# now comes from the mode, so the duplicate is gone.
#
# Every detector below is selectable via select_device() and has a full motors/db_x/db_y/
# distance block, even where some axes don't physically exist (device: null) —
# e.g. lambda2M has no horizontal/vertical translation stage, only swing angles.

detectors:

  eiger4M:
    motors:
      - name: horizontal
        device: null
        position: 256.0
      - name: vertical
        device: null
        position: 77.0
      - name: swing_angle_horizontal
        device: huber.nu
      - name: swing_angle_vertical
        device: huber.delta
    db_x: 716.0
    db_y: 815.0
    distance: 4.0
    pixel_size: 75.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

  rigaku3M:
    motors:
      - name: horizontal
        device: detector.x
        position: -275.0
      - name: vertical
        device: detector.y
        position: 170.0
      - name: swing_angle_horizontal
        device: flight_path_8idi.swing
      - name: swing_angle_vertical
        device: null
    db_x: 1052
    db_y: 852
    distance: 22
    pixel_size: 76.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

  lambda2M:
    motors:
      - name: horizontal
        device: null
      - name: vertical
        device: null
      - name: swing_angle_horizontal
        device: huber.nu
      - name: swing_angle_vertical
        device: huber.delta
    db_x: 779.0
    db_y: 987.0
    distance: 2.2
    pixel_size: 55.0e-6          # metres, written to NeXus x/y_pixel_size
    allow_motion: false

diagnostics:

  microscope:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: 155
      - device: cam_stage_8idi.y
        position: 2.6

  pind:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: 100
      - device: cam_stage_8idi.y
        position: 2.6

  wavefront:
    allow_motion: true
    motors:
      - device: cam_stage_8idi.x
        position: -19.02
      - device: cam_stage_8idi.y
        position: 2.6

sample_envs:

  qnw:
    allow_motion: true
    motors:
      - device: granite.x
        position: 923.0
    valve: granite_8idi_valve.enable

  rheometer:
    allow_motion: true
    motors:
      - device: granite.x
        position: 73.7
    valve: granite_8idi_valve.enable

  robot:
    allow_motion: true
    motors:
      - device: granite.x
        position: 62.0
    valve: granite_8idi_valve.enable
