# =============================================================================
# SPEC file template for the Ophyd scans in plans/align/ophyd_scan.py
#
#   /home/beams/8IDIUSER/bluesky/src/id8_common/configs/spec_template.yml
# =============================================================================
#
# Edit this file to change what goes into the .spec file. No Python changes are
# needed -- add or delete a line here and the next scan picks it up.
#
# Full reference:
#   /home/beams/8IDIUSER/bluesky/src/id8_common/plans/align/OPHYD_SCAN.md
#
# To try something without disturbing the beamline default, copy this file and
# point at the copy, either per call or for the whole session:
#
#     dscan_ophyd(..., spec_template="~/my_template.yml")
#     export ID8_SPEC_TEMPLATE=~/my_template.yml
#
# ---------------------------------------------------------------------------
# Where values come from ("source:")
#
#   motor              scanned motor readback (.position)
#   motor_setpoint     where the motor was told to go for this point
#   epoch              whole seconds since the scan started
#   epoch_float        the same, with fractions
#   det.<path>         attribute path on the detector passed to THIS scan, so
#                      one template serves eiger4M and lambda2M alike
#                      (e.g. det.stats1.total, det.roi1.size.x)
#   <device>.<path>    any device in the oregistry
#                      (e.g. tetramm1.current1.mean_value)
#
# A source must name a signal that returns a SINGLE value. A bare device path
# such as "huber.eta" returns a namedtuple of all its components, which cannot
# be written -- use "huber.eta.user_readback". Same idea for the ROIs below:
# name the individual PV (det.roi1.size.x), never the parent (det.roi1).
#
# ---------------------------------------------------------------------------
# Text substitutions usable in any label or value
#
#   {motor}        name of the scanned motor, e.g. "huber_delta"
#   {det}          name of the detector, e.g. "lambda2M"
#   {scan_type}    the scan function, e.g. "dscan_ophyd"
#   {num_points}   points in the scan  \  as passed to
#   {count_time}   exposure per point  /  dscan_ophyd()
#   {image_file}   name of the detector HDF5 file for this scan
#   {comment}      the scan's free-text note
#
# {comment} comes from dscan_ophyd(..., comment="..."). It is the first entry in
# the metadata list below, so it lands on the first #MD line of the scan -- move
# that entry if you want it elsewhere. Newlines in it are flattened to spaces so
# a note can never break the file structure.
#
# {image_file} is NOT an argument you pass. dscan_ophyd() builds it by calling
# gen_folder_prefix() (plans/acquire/ad_acq.py), which assembles
#
#     <header><measurement_num:04d>_<sample_name>_a<attenuation:04d>.h5
#
# from pv_registers.header, pv_registers.measurement_num,
# pv_registers.sample_name and the live filter_8ide attenuation -- e.g.
# "A0186_HEA-15GPa-3x3Grid_a0010.h5". measurement_num increments once per scan,
# and only when save_img=1. With save_img=0 there is no image file and
# {image_file} is empty, which is what skip_if_empty below is for.
#
# ---------------------------------------------------------------------------
# Per-entry flags
#
#   optional: true         device missing -> skip with a warning, do not fail
#   skip_if_empty: true    (metadata only) omit the line when the value is blank
#
# Use "sources" (plural) instead of "source" to put several PVs on ONE header
# line -- see the ROI entries below. Metadata only: a data column must stay a
# single number, so columns always use "source".
# =============================================================================

version: 1

# ---------------------------------------------------------------------------
# Context snapshot -- THIS LIST IS WHERE #O AND #P COME FROM.
#
# It records the positions of everything NOT being scanned, so you can
# reconstruct the geometry later. The list below produces two kinds of line:
#
#   #O0/#O1...  the motor NAMES     -- written once per FILE, in the #F header
#   #P0/#P1...  their POSITIONS     -- written once per SCAN, in the #S block
#
# The trailing digit is only line wrapping: SPEC puts 8 entries per line, so the
# 15 positioners below become #O0 (first 8) + #O1 (remaining 7), and likewise
# #P0 + #P1. Order is exactly the order of this list, so the Nth name across the
# #O lines pairs with the Nth value across the #P lines:
#
#   #O0 huber_nu  huber_delta  huber_mu  huber_eta  huber_chi  huber_phi  huber_x  huber_y
#   #O1 huber_z  sample_x  sample_y  sample_z  rheometer_x  rheometer_y  rheometer_z
#   #P0 -0.00049  30.0004  -0.00039  -0.00027  90.00002  0.00033  -0.12761  21.1945
#   #P1 -4.7409  173.654  24.9957  3.38223  0  0  0
#
# Dotted paths are resolved from the oregistry; anything missing is skipped with
# a warning.
#
# THIS LIST DOES NOT LIMIT WHAT YOU CAN SCAN. It is only the context snapshot --
# dscan_ophyd() accepts any positioner in the session, listed here or not, and
# the scanned motor is appended to #O/#P automatically when it is absent. No code
# or template change is needed to scan a new motor.
#
# The one side effect: appending changes the length of the list, so alternating
# between a listed and an unlisted scanned motor starts a new #F block on every
# switch (see below). If you scan a motor regularly, add it here so the list
# stays fixed and the file stays tidy.
#
# Note that huber and psic drive the SAME physical motors (both on
# 8ideSoft:CR8-E1:), so listing both records every angle twice. huber is the
# superset -- psic has no x/y/z.
#
# Changing this list is safe mid-experiment. Because #O is written once per file
# but #P once per scan, a changed list would otherwise pair new positions with
# stale names; the writer detects that and starts a new #F block instead.
# ---------------------------------------------------------------------------
positioners:
  [huber.nu, huber.delta, huber.mu, huber.eta, huber.chi, huber.phi,
   huber.x, huber.y, huber.z,
   sample.x, sample.y, sample.z,
   rheometer.x, rheometer.y, rheometer.z]

# ---------------------------------------------------------------------------
# Scan header. Each entry becomes one "#MD key = value" line.
# Values are free text -- they are never parsed as numbers, so strings are fine.
# ---------------------------------------------------------------------------
metadata:
  # Free-text note from dscan_ophyd(..., comment="..."). Kept FIRST so it is the
  # first thing you see and the first thing Ctrl+F lands on. skip_if_empty means
  # scans run without a comment get no line at all. Move it or delete it like any
  # other entry -- if you delete it but still pass comment=, the note is written
  # first anyway rather than being silently dropped.
  - {key: comment, value: "{comment}", skip_if_empty: true}

  - {key: beamline_id, value: "8-ID-E"}
  - {key: scan_type,   value: "{scan_type}"}
  - {key: detectors,   value: "{det}"}
  - {key: motors,      value: "{motor}"}
  - {key: num_points,  value: "{num_points}"}
  - {key: count_time,  value: "{count_time}"}
  - {key: image_file,  value: "{image_file}", skip_if_empty: true}

  # Detector ROIs, one #MD line per ROI. roi1 is the one the stats plugins
  # follow. "sources" (plural) reads several PVs and joins them into one value:
  #
  #     #MD roi1 = min_x=730 min_y=983 size_x=100 size_y=10
  #
  # Written as a mapping, the names are kept. Write it as a plain list instead
  # to get bare values in order ("730 983 100 10"). Only x/y are recorded --
  # the ROI plugin's z entries are not meaningful for these 2D detectors.
  - {key: roi1, optional: true, sources: {min_x: det.roi1.min_xyz.min_x, min_y: det.roi1.min_xyz.min_y, size_x: det.roi1.size.x, size_y: det.roi1.size.y}}
  - {key: roi2, optional: true, sources: {min_x: det.roi2.min_xyz.min_x, min_y: det.roi2.min_xyz.min_y, size_x: det.roi2.size.x, size_y: det.roi2.size.y}}
  - {key: roi3, optional: true, sources: {min_x: det.roi3.min_xyz.min_x, min_y: det.roi3.min_xyz.min_y, size_x: det.roi3.size.x, size_y: det.roi3.size.y}}
  - {key: roi4, optional: true, sources: {min_x: det.roi4.min_xyz.min_x, min_y: det.roi4.min_xyz.min_y, size_x: det.roi4.size.x, size_y: det.roi4.size.y}}

# ---------------------------------------------------------------------------
# Free-text comments, written as "#C <timestamp>.  <text>".
# Avoid the word exit_status -- readers treat any #C containing it as the scan's
# exit state.
# ---------------------------------------------------------------------------
comments:
  - "plan_type = function"

# ---------------------------------------------------------------------------
# Data columns -- ORDER MATTERS.
#
# The specr_py viewer defaults the X axis to the FIRST column and the Y axis to
# the LAST one. So keep the scanned motor first and your primary counter last,
# or the default plot will not be the one you want.
# ---------------------------------------------------------------------------
columns:
  - {label: "{motor}", source: motor}
  - {label: "{motor}_setpoint", source: motor_setpoint}

  # Elapsed time. Uncomment either or both to record it as a column.
  # epoch = whole seconds, epoch_float = fractional. Both count from the start
  # of the scan, not from the epoch, despite the SPEC-conventional name.
  # - {label: Epoch, source: epoch}
  # - {label: Epoch_float, source: epoch_float}

  # X-ray flux, for normalising against beam decay.
  - {label: tetramm1_current1, source: tetramm1.current1.mean_value, optional: true}

  - {label: "{det}_stats2_total", source: det.stats2.total}
  - {label: "{det}_stats3_total", source: det.stats3.total}

  # LAST = the viewer's default Y axis. Keep the primary counter here.
  - {label: "{det}_stats1_total", source: det.stats1.total}
  - {label: "{det}_stats4_total", source: det.stats4.total}
