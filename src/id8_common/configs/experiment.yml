# Per-experiment settings. Static for the run of an experiment -- edit by
# hand between experiments, then `expt.reload()` (or restart the session).
#
# These used to live in pv_registers StrReg1-7 / Reg48 on 8ideSoft:. They are
# read through id8_common.expt_config.expt, e.g. `expt.cycle_name`.
#
# Values below were seeded from the live registers on 2026-09-03.

# APS run cycle, e.g. "2026-3". Used to build the data path.
cycle_name: "2026-3"

# Root of the data tree. Trailing slash matters -- paths are built as
# <mount_point><cycle_name>/<experiment_name>/data/...
mount_point: "/gdata/dm/8ID/8IDE/"

# DM experiment name.
experiment_name: "pope202609"

# Where analysis runs. Any value other than "local" or "none" is passed straight
# through to DM as the machine name, so the usable ones are exactly what the
# xpcs8-boost-corr workflow accepts:
#
#   "adamite"     10.54.116.17    beamline GPU box; DM's own default
#   "amazonite"   10.54.136.96    beamline GPU box
#   "polaris"     164.54.113.77   ALCF, submitted via Gladier (gpuID 0, not -2)
#   "pioneer"     10.54.100.120   APS cluster, submitted via PBS
#
#   "local"       pick a beamline box at random -- see the warning below
#   "none"        write the data and submit no analysis job at all
#
# adamite and amazonite run stage 05-LOCAL, which is `ssh <machine>
# "boost_corr_bin ..."`, so the name has to resolve from the DM host -- both do.
#
# "local" calls utils/misc.get_machine_name(), which now picks adamite or
# amazonite with equal probability. Until 2026-09-09 that list was
# ["adamite", "califone", "califone"] and califone (10.54.116.22) is not one of
# the workflow's accepted machines, so "local" handed DM an unusable machine
# about two times in three. Name a machine explicitly if you care which runs it.
analysis_machine: "adamite"

# DM workflow to submit to.
workflow_name: "xpcs8-boost-corr"

# "yes" puts each measurement in its own <file_header>/ subfolder;
# "no" writes them all directly under data/.
# Quoted deliberately: bare yes/no is a YAML boolean.
use_subfolder: "no"

# NOTE: detector pixel size is NOT here -- it is per detector, in
# plans/set/device_position.yaml (`pixel_size:` in each detector block).
