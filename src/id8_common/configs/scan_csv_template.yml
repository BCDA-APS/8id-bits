# =============================================================================
# scan_csv_template.yml -- what a scan writes into its .csv file
# =============================================================================
#
# Every scan run by ophyd_scan.py writes ONE .csv file, named after the
# detector .h5 file it goes with:
#
#     /gdata/dm/8ID/8IDE/<cycle>/<experiment>/data/bluesky/A0201_Test_a0010.h5
#     /gdata/dm/8ID/8IDE/<cycle>/<experiment>/data/bluesky/A0201_Test_a0010.csv
#
# The file has two parts, and this template controls both:
#
#   lines:    things that DO NOT change during the scan.  One line each,
#             written above the marker, as   label,value
#   columns:  things that DO change during the scan.  One column each, one
#             row per scan point, written below the marker.
#
# Edit this file to add or remove either.  You do not need to touch any
# Python.  Restarting bluesky is not required -- the template is re-read at
# the start of every scan.
#
# -----------------------------------------------------------------------------
# The three ways to give a line a value
# -----------------------------------------------------------------------------
#
#   value:   text, with {...} substitutions filled in by the scan
#            -> "label,text"
#   source:  ONE dotted path to a PV; its value is read once, at scan start
#            -> "label,value"
#   values:  a LIST of dotted paths; all read once, all on the same line
#            -> "label,value1,value2,value3"
#
# Add   optional: true   to any entry that may not exist on every station or
# with every detector.  Those are skipped (with one note printed) instead of
# stopping the scan.  Anything NOT marked optional is an error, raised before
# the scan starts rather than halfway through.
#
# Add   skip_if_empty: true   to leave the line out entirely when the value
# comes back blank -- used for the comment, so an unnamed scan has no empty
# comment line.
#
# -----------------------------------------------------------------------------
# Dotted paths
# -----------------------------------------------------------------------------
#
#   det.something      the detector passed to THIS scan (eiger4M, lambda2M,
#                      tetramm1, ...) -- which is why one template works for
#                      all of them
#   motor.something    the motor being scanned
#   name.something     any device in the oregistry, e.g. huber.delta,
#                      sample.x, filter_8ide.attenuation.readback
#
# Always name the individual signal, never a parent device: lambda2M.roi1 as
# a whole reads back a namedtuple of every field, which is not a value anyone
# wants in a file.  lambda2M.roi1.size.x is a number.
#
# -----------------------------------------------------------------------------
# {...} substitutions available in labels and in value:
# -----------------------------------------------------------------------------
#
#   {start_time}   "2026-08-26 14:32:07", when the scan started
#   {epoch}        the same instant as a unix timestamp
#   {h5_name}      just the NAME of that .h5 file, e.g. "A0201_Test_a0010.h5".
#                  Empty when save_img=0.
#   {h5_file}      FULL PATH of the detector .h5 file for this scan.  It is
#                  NOT an argument to dscan_ophyd().  The scan builds it:
#                  gen_folder_prefix() combines expt.header +
#                  expt.measurement_num + expt.sample_name + the current
#                  attenuation into e.g. "A0201_Test_a0010", and that goes in
#                  the experiment's data/bluesky folder.  Empty when
#                  save_img=0.
#   {comment}      the comment="..." argument of the scan
#   {command}      the call that produced this file, e.g.
#                  "dscan(huber_delta, -0.5, 0.5, 41, 1.0, det=lambda2M)"
#   {scan_type}    "dscan" -- the bare name, never the _ophyd alias
#   {motor}        name of the FIRST scanned motor, e.g. "huber_delta"
#   {motor1}       the same thing, spelled to match {motor2}
#   {motor2}       name of the second scanned motor in a d2scan/a2scan/dmesh/
#                  mesh.  EMPTY in a one-motor dscan/ascan.
#   {motors}       all of them, space separated: "huber_nu sim_z"
#   {det}          name of the detector, e.g. "lambda2M"
#   {num_points}   number of points
#   {num1},{num2}  raster shape -- points along motor1 and motor2.
#                  EMPTY unless this is a dmesh/mesh.
#   {shape}        the same as "11x11".  EMPTY unless this is a dmesh/mesh.
#   {motor1_start} the COMMANDED first and last position of each raster axis,
#   {motor1_stop}  so a 2D viewer can rebuild the grid exactly instead of
#   {motor2_start} inferring it from the readbacks (a real stage repeats only to
#   {motor2_stop}  its deadband, and an aborted mesh spans less than it was told
#                  to).  EMPTY unless this is a dmesh/mesh.
#   {count_time}   seconds per point
#
# =============================================================================

version: 1


# -----------------------------------------------------------------------------
# LINES -- written once, above the marker, as "label,value"
# -----------------------------------------------------------------------------
lines:

  # The first four are the ones you asked for, in order.
  - {label: start_time, value: "{start_time}"}
  - {label: h5_file,    value: "{h5_file}"}   # full path to the images
  - {label: h5_name,    value: "{h5_name}"}   # just the file name
  - {label: comment,    value: "{comment}", skip_if_empty: true}

  # What the scan was.
  - {label: command,     value: "{command}"}
  - {label: scan_type,   value: "{scan_type}"}
  # "motor" keeps its label so anything already reading that key still finds the
  # first motor.  The four lines below appear ONLY when they apply, so a plain
  # dscan's header block is unchanged from before two-motor scans existed.
  - {label: motor,       value: "{motor1}"}
  - {label: motor2,      value: "{motor2}", skip_if_empty: true}
  - {label: detector,    value: "{det}"}
  - {label: num_points,  value: "{num_points}"}
  # A viewer should test for the PRESENCE of "shape" to decide whether to draw a
  # grid -- not string-match scan_type.  A d2scan/a2scan moves two motors along a
  # single line and must NOT be gridded, so it writes no shape.
  - {label: shape,       value: "{shape}", skip_if_empty: true}   # "11x11", raster only
  - {label: num1,        value: "{num1}",  skip_if_empty: true}   # points along motor1 (outer/slow)
  - {label: num2,        value: "{num2}",  skip_if_empty: true}   # points along motor2 (inner/fast)
  # The COMMANDED first/last position of each raster axis.  A 2D viewer needs
  # these to rebuild the grid exactly: motor READBACKS differ at every visit to
  # the same cell (a real stage repeats only to its retry deadband), and an
  # aborted mesh spans less than it was told to -- so a viewer that infers the
  # grid from the readbacks alone puts the measured rows in the wrong cells.
  # Raster scans only; a dscan/d2scan writes none of these.
  - {label: motor1_start, value: "{motor1_start}", skip_if_empty: true}
  - {label: motor1_stop,  value: "{motor1_stop}",  skip_if_empty: true}
  - {label: motor2_start, value: "{motor2_start}", skip_if_empty: true}
  - {label: motor2_stop,  value: "{motor2_stop}",  skip_if_empty: true}
  - {label: count_time,  value: "{count_time}"}
  - {label: beamline,    value: "8-ID-E"}
  - {label: epoch,       value: "{epoch}"}

  # Beam condition at the start of the scan.
  - {label: attenuation, source: filter_8ide.attenuation.readback, optional: true}

  # Where every stage was standing when the scan started.  Add or remove
  # lines freely -- an unlisted motor can still be scanned, listing one here
  # only means its start position is recorded.
  - {label: huber_nu,     source: huber.nu,     optional: true}
  - {label: huber_delta,  source: huber.delta,  optional: true}
  - {label: huber_mu,     source: huber.mu,     optional: true}
  - {label: huber_eta,    source: huber.eta,    optional: true}
  - {label: huber_chi,    source: huber.chi,    optional: true}
  - {label: huber_phi,    source: huber.phi,    optional: true}
  - {label: huber_x,      source: huber.x,      optional: true}
  - {label: huber_y,      source: huber.y,      optional: true}
  - {label: huber_z,      source: huber.z,      optional: true}
  - {label: sample_x,     source: sample.x,     optional: true}
  - {label: sample_y,     source: sample.y,     optional: true}
  - {label: sample_z,     source: sample.z,     optional: true}
  - {label: rheometer_x,  source: rheometer.x,  optional: true}
  - {label: rheometer_y,  source: rheometer.y,  optional: true}
  - {label: rheometer_z,  source: rheometer.z,  optional: true}

  # Detector ROIs.  "values:" puts several numbers on one line; the order
  # here is  min_x, min_y, size_x, size_y  -- so "roi1,730,983,100,10".
  - {label: roi1, values: [det.roi1.min_xyz.min_x, det.roi1.min_xyz.min_y, det.roi1.size.x, det.roi1.size.y], optional: true}
  - {label: roi2, values: [det.roi2.min_xyz.min_x, det.roi2.min_xyz.min_y, det.roi2.size.x, det.roi2.size.y], optional: true}
  - {label: roi3, values: [det.roi3.min_xyz.min_x, det.roi3.min_xyz.min_y, det.roi3.size.x, det.roi3.size.y], optional: true}
  - {label: roi4, values: [det.roi4.min_xyz.min_x, det.roi4.min_xyz.min_y, det.roi4.size.x, det.roi4.size.y], optional: true}


# -----------------------------------------------------------------------------
# MARKER -- the line that says "the scan data starts below here"
# -----------------------------------------------------------------------------
# The line straight after it holds the column names; every line after that is
# one scan point.  Keep the leading "#" so readers can tell it apart from the
# label,value lines above and from the data below.
marker: "#DATA"


# -----------------------------------------------------------------------------
# COLUMNS -- one value per scan point, written below the marker
# -----------------------------------------------------------------------------
# Order matters for plotting.  The 1D viewer (scanviewer.py) defaults its X axis
# to the FIRST column and makes you pick Y; the 2D viewer (meshviewer.py)
# defaults X to the first, Y to the second and Z to the LAST.  So: the scanned
# motors first, in the order the scan moved them, and your main counter last.
#
# Four sources are computed by the scan rather than read from a PV:
#
#   motor           where the motor actually is (readback)
#   motor_setpoint  where the motor was told to go
#   elapsed         seconds since the scan started
#   epoch           unix timestamp of the point
#
# ...anything else is a dotted path, read fresh at every point.
#
# Every detector column below is marked optional so that ONE template covers
# all three detectors: an eiger4M or lambda2M scan uses the stats columns, a
# tetramm scan skips them, and each scan prints one line naming what it
# skipped. The first motor column and elapsed_time are NOT optional -- see the
# note on them just below.
#
# Column labels must be unique -- a duplicate makes the file ambiguous, so it
# is rejected before the scan starts.
columns:
  # The scanned motors, in the order the scan was given them.  motor1 is always
  # present; motor2 exists only in a two-motor scan (d2scan, a2scan, dmesh,
  # mesh) and is skipped -- with one printed note -- in a plain dscan/ascan.
  #
  # Do NOT delete these: a scan refuses to start if an axis it is about to move
  # has no column, because the resulting file could not be plotted against that
  # axis and nothing downstream could reconstruct where it was.
  #
  # "source: motor" and "source: motor1" mean the same thing, so a beamline-local
  # template that still says "motor" keeps working untouched.
  - {label: "{motor1}",            source: motor1}
  - {label: "{motor2}",            source: motor2, optional: true}
  # - {label: "{motor1}_setpoint",   source: motor1_setpoint}
  # - {label: "{motor2}_setpoint",   source: motor2_setpoint, optional: true}
  - {label: elapsed_time,          source: elapsed}

  # TetrAMM picoammeters, named outright rather than as "det.*". Naming the
  # device means these work both when a tetramm is just monitoring the beam
  # during an eiger/lambda scan AND when it is the detector being scanned --
  # writing them as "{det}_current1" would collide with this line in the
  # second case, and duplicate column names are rejected.
  #
  # These were commented out until 2026-09-06, which meant a scan whose DETECTOR
  # was a tetramm recorded no signal whatsoever: a tetramm has no stats1-4, so
  # every "det.*" line below was skipped as optional and the .csv came out with
  # nothing but motor position and elapsed_time.  Nothing to plot, nothing to
  # find a peak in -- and every lup defaults to tetramm1, so that was the entire
  # alignment path.  All optional, so they are simply skipped on a station where
  # a given picoammeter is not loaded.
  - {label: tetramm1_current1,     source: tetramm1.current1.mean_value, optional: true}
  - {label: tetramm1_current2,     source: tetramm1.current2.mean_value, optional: true}
  - {label: tetramm1_current3,     source: tetramm1.current3.mean_value, optional: true}
  - {label: tetramm1_current4,     source: tetramm1.current4.mean_value, optional: true}
  # tetramm3 before tetramm1 on purpose. On an eiger/lambda scan the stats
  # columns below come last and one of them is the default Y/Z; but on a scan
  # whose detector IS a tetramm those are all skipped, and then the last column
  # standing is what the viewers reach for -- which should be the summed current
  # of the picoammeter being scanned, not the other one.
  - {label: tetramm3_sum_all,      source: tetramm3.sum_all.mean_value,  optional: true}
  - {label: tetramm1_sum_all,      source: tetramm1.sum_all.mean_value,  optional: true}

  # Alicat PCD pressure controllers, two units. optional, so a scan run with
  # the 8idAlicat IOC down loses these four columns and nothing else.
  # Deliberately placed BEFORE the detector stats block: the viewers default
  # Y/Z to the LAST column, which should stay the detector counter, not a
  # pressure reading.
  - {label: pcd1_pressure,         source: pcd1.pressure,       optional: true}
  - {label: pcd1_setpoint,         source: pcd1.setpoint_rbv,   optional: true}
  - {label: pcd2_pressure,         source: pcd2.pressure,       optional: true}
  - {label: pcd2_setpoint,         source: pcd2.setpoint_rbv,   optional: true}

  # Area-detector ROI counters. stats1 last: it is the default Y axis.
  - {label: "{det}_stats4_total",  source: det.stats4.total, optional: true}
  - {label: "{det}_stats3_total",  source: det.stats3.total, optional: true}
  - {label: "{det}_stats2_total",  source: det.stats2.total, optional: true}
  - {label: "{det}_stats1_total",  source: det.stats1.total, optional: true}
